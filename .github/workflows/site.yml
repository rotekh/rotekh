name: Publicar site
on:
  push:
    branches: [main]
    tags: ['*-v*']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar pandoc e LaTeX
        run: sudo apt-get update && sudo apt-get install -y pandoc texlive-xetex texlive-lang-portuguese fonts-texgyre
      - name: Gerar PDFs
        run: ./ferramentas/gerar-pdfs.sh
      - name: Construir site
        run: python3 ferramentas/construir_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar edição (quando houver tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          livro="${tag%-v*}"
          gh release create "$tag" pdf/"$livro"/*.pdf --title "$tag" --notes "Edição congelada de $livro."
  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

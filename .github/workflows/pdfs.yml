name: Gerar PDFs
on:
  push:
    branches: [main]
    paths: ['livros/**', 'ferramentas/**']
  workflow_dispatch:
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y pandoc texlive-xetex texlive-lang-portuguese fonts-texgyre
      - run: ./ferramentas/gerar-pdfs.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: pdf/
